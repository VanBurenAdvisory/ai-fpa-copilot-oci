<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI FP&A Copilot</title>
  <link rel="stylesheet" href="./styles.css?v=2" />
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <p class="eyebrow">FP&amp;A Narrative Dashboard</p>
      <h1>AI FP&amp;A Copilot</h1>
      <p class="subtitle">Upload a CSV and generate an executive summary, key drivers, risks, and scenarios.</p>
    </header>

    <div class="workspace">
      <section class="card form-card">
        <h2>Selection Options</h2>

        <div class="field-group">
          <label for="csvFile">Financial CSV</label>
          <input type="file" id="csvFile" accept=".csv" />
        </div>

        <div class="field-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="DemoCo" />
        </div>

        <div class="field-group">
          <label for="summaryLevel">Summary Level</label>
          <select id="summaryLevel">
            <option value="executive">Executive Level</option>
            <option value="management">Management Level</option>
            <option value="detailed">Detailed Analysis</option>
          </select>
        </div>

        <fieldset class="date-range-field">
          <legend>Data Range</legend>

          <div class="date-inputs">
            <div>
              <label for="startDate">Start Date</label>
              <input type="date" id="startDate" />
            </div>

            <div>
              <label for="endDate">End Date</label>
              <input type="date" id="endDate" />
            </div>
          </div>

          <label class="checkbox-label">
            <input type="checkbox" id="analyzeAllData" checked />
            Analyze all Data
          </label>
        </fieldset>

        <div class="action-row">
          <button id="analyzeBtn" class="analyze-button">Analyze</button>
          <span id="status" class="status-text" aria-live="polite">Waiting for file...</span>
        </div>
      </section>

      <section class="card output-card">
        <div class="output-header">
          <div>
            <p class="eyebrow">Narrative Results</p>
            <h2>AI Output</h2>
          </div>
        </div>
        <div id="output"></div>
      </section>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
