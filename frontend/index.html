<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI FP&A Copilot</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <div class="top-bar">
      <h1>AI FP&A Copilot</h1>

      <section class="status-panel" aria-live="polite">
        <h2>Status</h2>
        <pre id="status">Waiting for file...</pre>
      </section>

      <p class="subtitle">Upload a CSV and generate an executive summary, key drivers, risks, and scenarios.</p>
    </div>

    <section class="card form-card">
      <div class="file-field">
        <label for="csvFile">Financial CSV</label>
        <input type="file" id="csvFile" accept=".csv" />
      </div>

      <div class="company-field">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="DemoCo" />
      </div>

      <button id="analyzeBtn" class="analyze-button">Analyze</button>
    </section>

    <section class="card">
      <h2>AI Output</h2>
      <div id="output"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
